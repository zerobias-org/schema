id: 029b657f-4bc4-577b-85ca-a891dd085c1b
description: A physical entry point or access control device such as doors, gates, or barriers
extends:
  - Asset
  - Resource
  - PhysicalObject
properties:
  - entryType:
    field: physicalEntry.type
  - state:
    field: physicalEntry.status
  - capacity:
    field: accessZone.capacity
  - operation:
    field: physicalEntry.operation
  # Links
  - site:
    linkTo: PhysicalSite.id.entries
  - zone:
    linkTo: AccessZone.id.entries
  - schedules:
    linkTo: Schedule.id.entries
    multi: true
  - app:
    linkTo: PhysicalAccessManagementApp.id.entries
  - connects:
    multi: true
    linkTo: PhysicalSpace.id.openings
    t3: opening
  - devices:
    multi: true
    linkTo: SecurityDevice.id.secures
    t3: openingSide
  # accessRules inherited from Resource

