description: "Source Code Management (SCM) Account"
icon: images/classes/auditmation/base/SourceCodeMgmtAcct.svg
extends:
  - Account
  - SourceCodeMgmtPrincipal
links:
  models:
    # --- compliance features ---
    - f_2fa      # Two-Factor Authentication (2FA)
properties:
  - repo:
    multi: true
    linkTo: Repository
    t3: permissionSet
  - prAssignee:
    linkTo: PullRequest.id.assignee
    hidden: true
    multi: true
  - prReviewer:
    linkTo: PullRequest.id.reviewer
    hidden: true
    multi: true
  - reviews:
    linkTo: CodeReview
    hidden: true
    multi: true
