description: "How the leaf of an opening moves"
displayName: "Operation"
values:
  - SWING: "Single-action hinged leaf"
  - DOUBLE_ACTION: "Hinged leaf that swings both ways"
  - SLIDING: "Slides along the wall (pocket, barn, patio)"
  - SECTIONAL_OVERHEAD: "Panels ride tracks up and along the ceiling (garage, loading dock)"
  - ROLL_UP: "Coils onto a drum above the opening (shutter, grille)"
  - BI_FOLD: "Folds in panels"
  - REVOLVING: "Revolving door or turnstile"
  - PIVOT: "Rotates about a vertical axis away from the edge"
  - FIXED: "Does not open (fixed window, glazed panel)"
  - NONE: "No leaf (open bay, gap, barrier arm)"
