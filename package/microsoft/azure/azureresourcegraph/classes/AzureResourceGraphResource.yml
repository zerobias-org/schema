description: An Azure resource collected from the Azure Resource Graph Resources table
extends:
  - InventoryItem
properties:
  - region:
    field: cloud.region
  - kind:
    field: azureResource.kind
  - managedBy:
    field: azureResource.managedBy
  # Links declared locally: the dataloader resolves `extends` against
  # interfaces only (ConcreteClassFileHandler), so AzureInventoryItem's
  # links cannot be inherited. Same targets, correct spelling. uniLink
  # because the suite classes cannot grow reverse links in this package.
  - subscription:
    linkTo: AzureSubscription
    uniLink: true
  - resourceGroup:
    linkTo: AzureResourceGroup
    uniLink: true
  - resourceProvider:
    linkTo: AzureResourceProvider
    uniLink: true
  - resourceType:
    linkTo: AzureResourceType
    uniLink: true
