description: An Azure resource collected from the Azure Resource Graph Resources table
# The dataloader resolves `extends` against interfaces only; the suite's
# AzureResource interface carries the subscription / resourceGroup /
# resourceProvider / resourceType links.
extends:
  - InventoryItem
  - AzureResource
properties:
  - region:
    field: cloud.region
  - kind:
    field: azureResource.kind
  - managedBy:
    field: azureResource.managedBy
