name: "@zerobias-org/schema"
version: "1.0.0"

# Schema packages publish two npm artifacts at the same version:
#   @zerobias-org/schema-{v}-{p}      (YAML schema definitions)
#   @zerobias-org/schema-{v}-{p}-ts   (TypeScript interfaces generated
#                                      from the loaded schema)
#
# The TS twin is generated at gate time inside the same Neon branch
# that dataloader uses (only place where the schema is queryable by
# schema-ts-generator). Plugin: zb.schema.

# ── Shared dev credentials — inherited, not redeclared ───────────────
# ZB_TOKEN / ZB_API_KEY / ZB_ORG_ID / ZB_PLATFORM_URL / KNOWLEDGE_MCP_URL /
# NPM_CONFIG_TAG live ONCE per slot on the shared `dev` stack
# (@zerobias-org/dev-stack, auto-pulled from the registry at
# `zbb stack add`) and are IMPORTED here — the same
# depends/imports/exports pattern the platform and hub stacks use to
# inherit Dana's env. scripts/setup-org-credentials.sh seeds the dev
# stack once per slot; `zbb --slot <s> --stack schema env get ZB_ORG_ID`
# then resolves transitively. `optional:` = an unseeded slot yields
# empty vars (exactly like an unseeded local declaration used to)
# instead of a hard resolve error.
# ⚠ Never `env set` these six on THIS stack: a per-stack override
# permanently shadows the import, so credential rotation on the dev
# stack stops propagating here (zbb never clobbers user overrides).
depends:
  dev:
    package: "@zerobias-org/dev-stack@^1.0.0"

imports:
  dev:
    optional: true
    vars:
      - ZB_TOKEN
      - ZB_API_KEY
      - ZB_ORG_ID
      - ZB_PLATFORM_URL
      - KNOWLEDGE_MCP_URL
      - NPM_CONFIG_TAG

env:
  DATALOADER_SERVICE_URL:
    type: string
    default: "https://app.zerobias.com/api/dataloader"
    description: >-
      Dataloader endpoint for the GATE's Neon step (separate from
      ZB_PLATFORM_URL — the gate does not honor that var). LEAVE ON THE
      PROD DEFAULT even for non-prod org targets: the step auths with the
      prod-issued ZB_TOKEN, and a per-env override makes that key 401.
      The org load never reads this (it uses ZB_PLATFORM_URL + ZB_API_KEY).

  NEON_API_KEY:
    source: vault
    vault: "operations-kv/neon/content.api-key"
    mask: true

  NEON_PROJECT_ID:
    source: vault
    vault: "operations-kv/neon/content.project-id"

  NEON_PARENT_BRANCH:
    type: string
    default: "content-master"
    description: Neon parent branch to create test branches from

  NEON_DB_ROLE:
    type: string
    default: "neondb_owner"
    description: Neon database role

  NEON_DB_NAME:
    type: string
    default: "zerobias"
    description: Neon database name

# ── Lifecycle ────────────────────────────────────────────────────────
# Schema packages have no Docker phase. The TS-twin publish runs inside
# `publish` (wired into the publishNpm aggregate by zb.schema).
#
# `version:` is required by the new zbb model (0.3.63+). The reusable
# workflow's `version` job calls `zbb version --modules=$PACKAGES`,
# which dispatches here → versionStandardPackages aggregates all module
# version bumps into a single commit pre-matrix. Without this entry,
# the workflow's version job fails.
lifecycle:
  clean:     ./gradlew clean
  build:     ./gradlew build
  test:      ./gradlew test
  gate:      ./gradlew gate
  gateCheck: ./gradlew gateCheck
  version:   ./gradlew versionStandardPackages
  publish:   ./gradlew publish
  # Org-first SDLC: publish an org-private rc + queue the org dataloader
  # job. The -PorgPublish=true flag is what flips the shared publish
  # pipeline into org mode — zbb does not inject it on its own. The TS
  # twin follows automatically (zb.schema handles org mode for the -ts
  # artifact too).
  publishOrg: ./gradlew publishOrg -PorgPublish=true

require:
  - tool: dataloader
    check: "dataloader --version 2>&1"
    parse: "Dataloader v(\\S+)"
    version: ">=1.0.87"
    install: "npm i -g @zerobias-com/platform-dataloader"
